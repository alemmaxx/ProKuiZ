name: Bina APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Pasang Capacitor
        run: npm install

      - name: Sediakan projek Android
        run: |
          npx cap add android
          if [ -f scripts/android-patch.js ]; then node scripts/android-patch.js; fi
          npx cap sync android

      - name: Jana ikon app
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor "#FFF3C9" --splashBackgroundColor "#FFF3C9"

      - name: Bina APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Namakan semula APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ProKuiz.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ProKuiz-APK
          path: ProKuiz.apk
